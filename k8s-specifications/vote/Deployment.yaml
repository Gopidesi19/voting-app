apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote-app
  template:
    metadata:
      labels:
        app: vote-app
    spec:
      containers:
        - name: vote-container
          image: devops119/vote:1.9
          ports:
            - containerPort: 80

